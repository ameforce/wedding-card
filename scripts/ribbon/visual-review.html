<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>리본과 종이 개봉 비교</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3eee7;color:#413a34;font:16px/1.6 system-ui,sans-serif}
header,main,footer{max-width:1040px;margin:auto;padding:16px}h1{font-size:24px;line-height:1.35;margin:0 0 8px}p{margin:8px 0}
button,select,.full-link{font:inherit;min-height:44px;padding:8px 12px;border:1px solid #b8aba0;border-radius:8px;background:#fffaf5;color:inherit}.full-link{text-decoration:none}
button:disabled{opacity:.45}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #776456;outline-offset:3px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:0}
figure{margin:0;min-width:0}figcaption{font-weight:600;margin-bottom:8px}.screen{position:relative;background:#faf4eb;overflow:hidden;width:100%;height:min(70svh,760px);border:1px solid #dfd4c8;border-radius:8px}
video,iframe{display:block;width:100%;height:100%;border:0}video{object-fit:contain;background:#e9e2d8}canvas{position:absolute;width:100%;height:auto;left:0;top:50%;transform:translateY(-50%)}
[hidden]{display:none!important}.seek{display:flex;gap:10px;align-items:center}.seek input{width:100%;min-height:44px}.candidate-large{grid-template-columns:1fr}.candidate-large .reference{display:none}.candidate-large .candidate{max-width:430px;width:100%;margin:auto}
footer{font-size:14px;color:#6e6258}#status{min-height:26px}
</style>
<header>
<h1>리본과 종이 개봉 비교</h1>
<p>원본과 함께 보며 고리가 풀리는 과정과 종이가 돌아가는 모습을 확인해 주세요.</p>
<div class="controls">
<label>확인할 동작 <select id="mode"><option value="ribbon">리본만</option><option value="full">전체 개봉</option></select></label>
<button id="restart" disabled>처음부터 재생</button><button id="pause" disabled>일시 정지</button>
<label id="speed-label">리본 속도 <select id="speed"><option value="1">정상</option><option value="0.25">0.25배</option></select></label>
<label id="zoom-label">매듭 확대 <select id="zoom"><option value="1">기본</option><option value="2">2배</option><option value="3">3배</option></select></label>
<button id="layout" aria-pressed="false">샘플 크게 보기</button>
<a id="full-link" class="full-link" href="/" hidden>청첩장 전체 화면</a>
</div>
<p id="status" role="status">리본을 준비하고 있습니다.</p>
<div id="seek-controls" class="seek"><input id="seek" type="range" min="0" value="0" step="1" aria-label="리본 장면 선택" disabled><output id="position"></output></div>
</header>
<main class="comparison">
<figure class="reference"><figcaption>원본 영상</figcaption><div class="screen"><video id="reference" src="/__review/reference.mp4" controls playsinline muted preload="metadata"></video></div></figure>
<figure class="candidate"><figcaption id="candidate-title">리본 샘플</figcaption><div id="candidate-screen" class="screen"><canvas id="ribbon" aria-label="리본 매듭 풀림 샘플"></canvas><iframe id="invitation" title="실제 청첩장 전체 개봉" hidden></iframe></div></figure>
</main>
<footer>전체 개봉은 실제 청첩장 화면을 새로 불러옵니다. 원본 영상은 자체 재생 막대로 따로 확인할 수도 있습니다.</footer>
<script type="module" src="/__review/app.mjs"></script>
</html>
