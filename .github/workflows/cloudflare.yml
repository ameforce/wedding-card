name: Cloudflare CI/CD

on:
  pull_request:
    branches:
      - develop
      - main
      - "hotfix/**"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      cloudflare-artifact-digest: ${{ steps.upload-artifact.outputs.artifact-digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Reject destructive D1 migrations
        run: npm run check:migrations

      - name: Lint
        run: npm run lint

      - name: Run UI tests
        run: npm run test:ui

      - name: Build production assets
        run: npm run build

      - name: Run Worker and deployment tests
        run: npm run test:sites

      - name: Validate the Cloudflare bundle
        run: npm run cloudflare:dry-run:built

      - name: Seal verified production assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/cloudflare-artifact.mjs create

      - name: Upload verified production assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: upload-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloudflare-production-${{ github.sha }}
          path: |
            dist/client
            dist/cloudflare-artifact-manifest.json
            dist/cloudflare-artifact.sha256
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://wdcard.enmsoftware.com/
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    steps:
      - name: Check out the exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Download verified production assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cloudflare-production-${{ github.sha }}
          path: dist

      - name: Verify promoted artifact identity before install
        env:
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.verify.outputs.cloudflare-artifact-digest }}
        run: |
          test -n "$EXPECTED_ARTIFACT_DIGEST"
          sha256sum --strict --check dist/cloudflare-artifact.sha256

      - name: Install locked dependencies without production credentials
        run: npm ci

      - name: Recheck additive-only migrations
        run: npm run check:migrations

      - name: Verify deployment inputs after install and checks
        run: sha256sum --strict --check dist/cloudflare-artifact.sha256

      - name: Verify exact-root Cloudflare Access protection
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run verify:cloudflare-access

      - name: Install Chromium for the rendered production canary
        run: npx playwright install --with-deps chromium

      - name: Capture recovery points
        id: recovery
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/cloudflare-deployment-state.mjs capture

      - name: Apply remote D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run d1:migrations:apply

      - name: Upload Worker and Static Assets version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npm run upload:cloudflare:version --
          --strict
          --no-bundle
          --tag "$GITHUB_SHA"
          --message "GitHub Actions $GITHUB_SHA"

      - name: Activate the uploaded Worker version
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npm run deploy:cloudflare:version --
          --version-tag "$GITHUB_SHA"
          --percentage 100
          --yes
          --message "GitHub Actions $GITHUB_SHA"

      - name: Verify the active Worker version
        id: active-version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/cloudflare-deployment-state.mjs verify "$GITHUB_SHA"

      - name: Run bounded production canary
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WEDDING_CANARY_ALLOW_PRODUCTION_WRITE: "1"
          WEDDING_CANARY_ALLOW_D1_ADMIN_READ: "1"
          WEDDING_CANARY_EXPECTED_WORKER_TAG: ${{ github.sha }}
          WEDDING_CANARY_EXPECTED_WORKER_VERSION: ${{ steps.active-version.outputs.active_worker_version }}
        run: npm run canary:production

      - name: Roll back Worker after post-deploy failure
        if: ${{ failure() && steps.upload.outcome == 'success' && steps.recovery.outputs.previous_worker_version != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          node scripts/cloudflare-deployment-state.mjs restore-if-changed
          "${{ steps.recovery.outputs.previous_worker_version }}"
          "$GITHUB_SHA"
